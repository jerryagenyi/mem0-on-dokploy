name: mem0

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - mem0-internal
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mem0-ollama
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - mem0-internal
    restart: unless-stopped

  mem0-api:
    build: ./api
    container_name: mem0-api
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    depends_on:
      - qdrant
      - ollama
    networks:
      - mem0-internal
      - shared-services
    restart: unless-stopped

volumes:
  qdrant-data:
  ollama-models:

networks:
  mem0-internal:
    driver: bridge
  shared-services:
    external: true
    name: shared-services
