name: mem0

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - mem0-internal
    restart: unless-stopped

  mem0-api:
    build: ./api
    container_name: mem0-api
    ports:
      - "0.0.0.0:8100:8000"
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    networks:
      - mem0-internal
      - shared-services
    restart: unless-stopped

volumes:
  qdrant-data:

networks:
  mem0-internal:
    driver: bridge
  shared-services:
    external: true
    name: shared-services
